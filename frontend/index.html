<!DOCTYPE html>
<!-- SPDX-License-Identifier: EUPL-1.2 -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Commando</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Courier New', monospace;
    background: #0a0a0a;
    color: #d4c89a;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  h1 { font-size: 2rem; letter-spacing: 0.25em; text-transform: uppercase; margin-bottom: 1.5rem; color: #c8a94a; }
  h2 { font-size: 1.1rem; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 1rem; color: #8a9a6a; }
  .view { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 820px; padding: 1rem; }
  .view.active { display: flex; }
  canvas { display: block; border: 1px solid #3a3a2a; margin: 0.75rem 0; }
  label { font-size: 0.85rem; letter-spacing: 0.1em; margin-top: 0.75rem; color: #8a9a6a; }
  .row { display: flex; gap: 1.5rem; align-items: flex-end; margin-bottom: 0.5rem; }
  .field { display: flex; flex-direction: column; }
  input[type=number] {
    background: #1a1a0e;
    border: 1px solid #4a4a2a;
    color: #d4c89a;
    font-family: inherit;
    font-size: 1.4rem;
    width: 6rem;
    text-align: center;
    padding: 0.3rem;
    margin-top: 0.25rem;
  }
  .derived { font-size: 1.4rem; padding: 0.3rem; width: 6rem; text-align: center; color: #c8a94a; margin-top: 0.25rem; }
  .btn {
    background: #2a2a1a;
    border: 1px solid #6a6a3a;
    color: #d4c89a;
    font-family: inherit;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0.5rem 1.4rem;
    margin: 0.3rem;
    transition: background 0.15s;
  }
  .btn:hover { background: #3a3a1a; }
  .btn:active { background: #1a1a0a; }
  .btn.primary { border-color: #c8a94a; color: #c8a94a; font-size: 1.1rem; padding: 0.6rem 2rem; }
  .btn.danger  { border-color: #9a4a2a; color: #c87a5a; }
  .participant-info {
    font-size: 1.6rem;
    letter-spacing: 0.2em;
    color: #c8a94a;
    margin: 0.4rem 0;
  }
  .timer-display {
    font-size: 2.4rem;
    letter-spacing: 0.3em;
    font-weight: bold;
    color: #d4c89a;
    margin: 0.2rem 0;
  }
  .timer-display.warning { color: #c87a2a; }
  .timer-display.critical { color: #c83a2a; }
  .controls { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .stat-row { display: flex; justify-content: space-between; gap: 2rem; margin: 0.3rem 0; font-size: 0.95rem; }
  .stat-label { color: #8a9a6a; }
  .stat-val   { color: #c8a94a; }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: #2a2a1a;
    margin: 0.3rem 0;
    border: 1px solid #3a3a2a;
  }
  .progress-fill { height: 100%; background: #6a8a4a; transition: width 0.5s linear; }
</style>
</head>
<body>

<!-- ── VIEW 1: SETUP ── -->
<div id="view-setup" class="view active">
  <h1>🪖 Daily Commando</h1>
  <canvas id="canvas-setup" width="820" height="180"></canvas>
  <div class="row">
    <div class="field">
      <label for="inp-n">SOLDIERS (N)</label>
      <input id="inp-n" type="number" min="1" max="20" value="5">
    </div>
    <div class="field">
      <label for="inp-total">TOTAL TIME (min)</label>
      <input id="inp-total" type="number" min="1" max="120" value="15">
    </div>
    <div class="field">
      <label>PER SOLDIER (min)</label>
      <div class="derived" id="per-soldier">3:00</div>
    </div>
  </div>
  <button class="btn primary" id="btn-start">▶ COMMENCE</button>
</div>

<!-- ── VIEW 2: RUNNING ── -->
<div id="view-run" class="view">
  <h2 id="run-title">SOLDIER 1 / 5</h2>
  <canvas id="canvas-run" width="820" height="220"></canvas>
  <div class="progress-bar"><div class="progress-fill" id="run-progress" style="width:100%"></div></div>
  <div class="timer-display" id="run-timer">3:00</div>
  <div class="controls">
    <button class="btn" id="btn-pause">⏸ PAUSE</button>
    <button class="btn primary" id="btn-next">NEXT ▶</button>
    <button class="btn danger" id="btn-abort">✕ ABORT</button>
  </div>
</div>

<!-- ── VIEW 3: SUMMARY ── -->
<div id="view-summary" class="view">
  <h1>MISSION COMPLETE</h1>
  <canvas id="canvas-summary" width="820" height="160"></canvas>
  <div id="summary-stats" style="width:420px;margin:0.75rem 0"></div>
  <button class="btn primary" id="btn-restart">↺ NEW DAILY</button>
</div>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
const state = {
  n: 5,
  totalSec: 900,
  perSec: 180,
  current: 0,       // 0-based participant index
  elapsed: [],      // seconds elapsed per participant
  paused: false,
  started: false,
  interval: null,
  tick: 0,          // animation frame counter
  animId: null,
};

// ─── Helpers ─────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

function showView(name) {
  ['setup','run','summary'].forEach(v => {
    $('view-'+v).classList.toggle('active', v === name);
  });
}

// ─── Canvas / Animation ──────────────────────────────────────────────────────
// Draw a single stick-figure commando at (cx, cy) with animation phase t [0,1]
// highlight = true → draw in gold
function drawSoldier(ctx, cx, cy, t, highlight, current) {
  const r = current ? 22 : 14;   // radius scale
  const legAngle = Math.sin(t * Math.PI * 2) * 0.55;
  const armAngle = -legAngle * 0.7;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.strokeStyle = highlight ? '#c8a94a' : '#5a6a4a';
  ctx.fillStyle   = highlight ? '#c8a94a' : '#5a6a4a';
  ctx.lineWidth   = current ? 3 : 2;
  ctx.lineCap = 'round';

  // head
  ctx.beginPath();
  ctx.arc(0, -r * 2.6, r * 0.7, 0, Math.PI * 2);
  ctx.fill();

  // helmet bump
  ctx.beginPath();
  ctx.arc(0, -r * 3.1, r * 0.5, Math.PI, Math.PI * 2);
  ctx.fill();

  // body
  ctx.beginPath();
  ctx.moveTo(0, -r * 1.85);
  ctx.lineTo(0, -r * 0.3);
  ctx.stroke();

  // left arm
  ctx.beginPath();
  ctx.moveTo(0, -r * 1.6);
  ctx.lineTo(Math.cos(armAngle + 2.4) * r * 1.2, -r * 1.6 + Math.sin(armAngle + 2.4) * r * 1.2);
  ctx.stroke();

  // right arm
  ctx.beginPath();
  ctx.moveTo(0, -r * 1.6);
  ctx.lineTo(Math.cos(-armAngle - 0.7) * r * 1.2, -r * 1.6 + Math.sin(-armAngle - 0.7) * r * 1.2);
  ctx.stroke();

  // left leg
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.3);
  ctx.lineTo(Math.sin(legAngle) * r * 1.5, r * 1.4);
  ctx.stroke();

  // right leg
  ctx.beginPath();
  ctx.moveTo(0, -r * 0.3);
  ctx.lineTo(-Math.sin(legAngle) * r * 1.5, r * 1.4);
  ctx.stroke();

  // participant number below
  if (current || highlight) {
    ctx.fillStyle = highlight ? '#c8a94a' : '#4a5a3a';
    ctx.font = `${current ? 14 : 11}px "Courier New"`;
    ctx.textAlign = 'center';
    ctx.fillText(String(Math.round(cx / 1)), 0, r * 2.2); // placeholder, filled by caller
  }

  ctx.restore();
}

function drawCanvas(canvasId, tick, highlight, done) {
  const canvas = $(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  ctx.clearRect(0, 0, W, H);

  // ground line
  ctx.strokeStyle = '#3a3a2a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, H - 30);
  ctx.lineTo(W, H - 30);
  ctx.stroke();

  const n = state.n;
  const spacing = Math.min(80, (W - 60) / Math.max(n, 1));
  const totalWidth = spacing * (n - 1);
  const startX = (W - totalWidth) / 2;
  const baseY = H - 30;

  // running offset (soldiers move right across canvas cyclically)
  const runOffset = done ? 0 : (tick * 1.5) % W;

  for (let i = 0; i < n; i++) {
    const isCurrent = (i === state.current) && !done;
    const isHighlight = highlight ? (i === state.current) : isCurrent;
    const phase = tick / 18 + i * 0.4;

    let x = startX + i * spacing;
    if (!done) {
      // current soldier slightly ahead (to the right in formation direction)
      x += isCurrent ? 15 : 0;
    }

    // draw number label
    const canvas2 = $(canvasId);
    const ctx2 = canvas2.getContext('2d');
    ctx2.save();
    ctx2.fillStyle = isHighlight ? '#c8a94a' : '#4a5a3a';
    ctx2.font = `${isCurrent ? 13 : 10}px "Courier New"`;
    ctx2.textAlign = 'center';
    ctx2.fillText(String(i + 1), x, baseY + 18);
    ctx2.restore();

    drawSoldier(ctx, x, baseY, phase, isHighlight, isCurrent);
  }

  // dust particles for running feel
  if (!done) {
    ctx.fillStyle = 'rgba(100,90,60,0.25)';
    for (let i = 0; i < n; i++) {
      const x = startX + i * spacing - 8;
      const size = (Math.sin(tick / 6 + i) + 1) * 3 + 1;
      ctx.beginPath();
      ctx.arc(x, baseY - 2, size, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// ─── Continuous animation loop ────────────────────────────────────────────────
function startAnim(canvasId, isRunning) {
  if (state.animId) cancelAnimationFrame(state.animId);
  function loop() {
    if (!state.paused || !isRunning) state.tick++;
    drawCanvas(canvasId, state.tick, isRunning, !isRunning);
    state.animId = requestAnimationFrame(loop);
  }
  loop();
}

function stopAnim() {
  if (state.animId) { cancelAnimationFrame(state.animId); state.animId = null; }
}

// ─── Setup view ──────────────────────────────────────────────────────────────
function updatePerSoldier() {
  const n     = parseInt($('inp-n').value) || 1;
  const total = parseInt($('inp-total').value) || 1;
  const sec   = Math.floor((total * 60) / n);
  $('per-soldier').textContent = fmt(sec);
}

$('inp-n').addEventListener('input', () => { state.n = parseInt($('inp-n').value) || 1; updatePerSoldier(); });
$('inp-total').addEventListener('input', updatePerSoldier);

$('btn-start').addEventListener('click', () => {
  state.n        = Math.max(1, parseInt($('inp-n').value) || 5);
  state.totalSec = Math.max(60, (parseInt($('inp-total').value) || 15) * 60);
  state.perSec   = Math.floor(state.totalSec / state.n);
  state.current  = 0;
  state.elapsed  = new Array(state.n).fill(0);
  state.paused   = false;
  state.tick     = 0;
  showView('run');
  startRun();
});

// ─── Run view ─────────────────────────────────────────────────────────────────
function updateRunUI() {
  const rem = Math.max(0, state.perSec - state.elapsed[state.current]);
  $('run-title').textContent  = `SOLDIER ${state.current + 1} / ${state.n}`;
  $('run-timer').textContent  = fmt(rem);
  $('run-timer').className    = 'timer-display' + (rem <= 10 ? ' critical' : rem <= 30 ? ' warning' : '');
  $('run-progress').style.width = (rem / state.perSec * 100) + '%';
  $('btn-pause').textContent  = state.paused ? '▶ RESUME' : '⏸ PAUSE';
}

function startRun() {
  clearInterval(state.interval);
  updateRunUI();
  startAnim('canvas-run', true);
  state.interval = setInterval(() => {
    if (state.paused) return;
    state.elapsed[state.current]++;
    updateRunUI();
    if (state.elapsed[state.current] >= state.perSec) {
      // auto-advance or show summary if last
      if (state.current < state.n - 1) {
        advanceParticipant();
      } else {
        finishRun();
      }
    }
  }, 1000);
}

function advanceParticipant() {
  state.current++;
  updateRunUI();
}

function finishRun() {
  clearInterval(state.interval);
  stopAnim();
  showSummary();
}

$('btn-pause').addEventListener('click', () => {
  state.paused = !state.paused;
  updateRunUI();
});

$('btn-next').addEventListener('click', () => {
  if (state.current < state.n - 1) {
    advanceParticipant();
  } else {
    finishRun();
  }
});

$('btn-abort').addEventListener('click', () => {
  clearInterval(state.interval);
  stopAnim();
  showView('setup');
  startAnim('canvas-setup', false);
});

// ─── Summary view ─────────────────────────────────────────────────────────────
function showSummary() {
  const totalUsed = state.elapsed.reduce((a, b) => a + b, 0);
  const avg       = state.n ? Math.floor(totalUsed / state.n) : 0;
  const maxE      = Math.max(...state.elapsed);
  const minE      = Math.min(...state.elapsed.filter(e => e > 0));

  const el = $('summary-stats');
  el.innerHTML = `
    <div class="stat-row"><span class="stat-label">SOLDIERS BRIEFED</span><span class="stat-val">${state.n}</span></div>
    <div class="stat-row"><span class="stat-label">TOTAL TIME USED</span><span class="stat-val">${fmt(totalUsed)}</span></div>
    <div class="stat-row"><span class="stat-label">AVG PER SOLDIER</span><span class="stat-val">${fmt(avg)}</span></div>
    <div class="stat-row"><span class="stat-label">LONGEST DEBRIEF</span><span class="stat-val">${fmt(maxE)}</span></div>
    <div class="stat-row"><span class="stat-label">SHORTEST DEBRIEF</span><span class="stat-val">${fmt(minE)}</span></div>
  `;

  showView('summary');
  state.tick = 0;
  startAnim('canvas-summary', false);
}

$('btn-restart').addEventListener('click', () => {
  stopAnim();
  showView('setup');
  state.tick = 0;
  startAnim('canvas-setup', false);
});

// ─── Boot ────────────────────────────────────────────────────────────────────
updatePerSoldier();
startAnim('canvas-setup', false);
</script>
</body>
</html>
