[package]
name = "daily-commando"
version = "0.1.0"
edition = "2026"
description = "A minimalist daily standup timer in commando style"
license = "EUPL-1.2"
repository = "https://github.com/robinsft/daily-commando"

[lib]
name = "daily_commando"
path = "src/lib.rs"

[[bin]]
name = "daily-commando"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossterm = "0.28"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
prometheus = "0.13"
tiny_http = "0.12"
once_cell = "1.20"
